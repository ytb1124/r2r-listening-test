testname: 공간 음향 재현 청취평가 (연구자 검토용)
testId: t18_review
bufferSize: 8192
stopOnErrors: true
showButtonPreviousPage: false
remoteService: service/write.php
pages:
- type: generic
  id: consent
  name: 연구 참여 동의
  content: <div style="display:inline-block;text-align:left;line-height:1.55"><div
    style="white-space:nowrap;margin:2px 0"><b>연구 참여 안내</b></div><div style="height:8px"></div><div
    style="white-space:nowrap;margin:2px 0"><b>목적</b>  어떤 공간의 울림을 다른 공간에서 재생할 때, 소리가
    원래 공간과 얼마나 비슷하게 들리는지 확인합니다.</div><div style="white-space:nowrap;margin:2px 0"><b>할
    일</b>  헤드폰으로 기준음과 여러 소리를 듣고, 기준음과 얼마나 비슷한지 0–100점으로 매긴 뒤 짧은 설문에 답합니다.</div><div
    style="white-space:nowrap;margin:2px 0"><b>시간</b>  연습 1화면과 본 평가 3화면입니다. 예상 시간은
    연구자가 안내합니다.</div><div style="white-space:nowrap;margin:2px 0"><b>위험</b>  재생 음량은
    연구자가 일상 수준으로 정해 두었습니다. 불편하면 언제든 멈출 수 있습니다.</div><div style="white-space:nowrap;margin:2px
    0"><b>자발성</b>  참여는 자유이며, 중간에 그만두어도 불이익이 없습니다.</div><div style="white-space:nowrap;margin:2px
    0"><b>수집 정보</b>  점수, 화면별 재생·조작 기록, 설문 답, 참가자 코드. 이름과 연락처는 결과에 저장하지 않습니다.</div><div
    style="white-space:nowrap;margin:2px 0"><b>이용</b>  학위·학회 논문과 발표에 쓰며, 개인을 알아볼 수
    없는 형태로만 공개합니다.</div><div style="white-space:nowrap;margin:2px 0">&nbsp;&nbsp;&nbsp;&nbsp;익명
    결과는 연구 재현을 위해 공개될 수 있습니다.</div><div style="white-space:nowrap;margin:2px 0"><b>문의</b>  궁금한
    점은 평가 전후에 연구자에게 물어보세요.</div><div style="height:8px"></div><div style="white-space:nowrap;margin:2px
    0"><label style="font-weight:600;cursor:pointer"><input type="checkbox" id="t18consent"
    data-role="none" style="width:18px;height:18px;vertical-align:middle;margin-right:8px">위
    내용을 읽었고, 연구 참여에 동의합니다.</label></div></div>
- type: generic
  id: welcome
  name: 안내
  content: 연구자 검토용 화면입니다. 조건 이름이 표시됩니다.
- - type: mushra
    id: speech
    name: 평가
    showWaveform: true
    enableLooping: true
    createAnchor35: false
    createAnchor70: false
    reference: configs/resources/audio/v18b/speech_A.flac
    stimuli:
      CTR_B: configs/resources/audio/v18b/speech_C_B.flac
      CTR_C: configs/resources/audio/v18b/speech_C_M.flac
      P04_B: configs/resources/audio/v18b/speech_P04_B.flac
      P04_C: configs/resources/audio/v18b/speech_P04_M.flac
      P08_B: configs/resources/audio/v18b/speech_P08_B.flac
      P08_C: configs/resources/audio/v18b/speech_P08_M.flac
      P05_B: configs/resources/audio/v18b/speech_P05_B.flac
      P05_C: configs/resources/audio/v18b/speech_P05_M.flac
      anchor35: configs/resources/audio/v18b/speech_A35.flac
      anchor70: configs/resources/audio/v18b/speech_A70.flac
    content: '<b>[연구자 검토 모드]</b> 음원 <b>Speech: ARU ID03</b> · 목표 BRAS CR3 MP3 · 자리
      중앙(설계 위치), P04, P08, P05<br/>CTR = 중앙 자리, B = 보정 없음, C = 보정(중앙 설계 초기·후기 에너지
      매칭), anchor35/anchor70 = 3.5/7 kHz 저역통과 앵커(BS.1534-3), reference = 숨긴 기준음.'
    showConditionNames: true
    randomize: false
  - type: mushra
    id: percA
    name: 평가
    showWaveform: true
    enableLooping: true
    createAnchor35: false
    createAnchor70: false
    reference: configs/resources/audio/v18b/percA_A.flac
    stimuli:
      CTR_B: configs/resources/audio/v18b/percA_C_B.flac
      CTR_C: configs/resources/audio/v18b/percA_C_M.flac
      P04_B: configs/resources/audio/v18b/percA_P04_B.flac
      P04_C: configs/resources/audio/v18b/percA_P04_M.flac
      P08_B: configs/resources/audio/v18b/percA_P08_B.flac
      P08_C: configs/resources/audio/v18b/percA_P08_M.flac
      P05_B: configs/resources/audio/v18b/percA_P05_B.flac
      P05_C: configs/resources/audio/v18b/percA_P05_M.flac
      anchor35: configs/resources/audio/v18b/percA_A35.flac
      anchor70: configs/resources/audio/v18b/percA_A70.flac
    content: '<b>[연구자 검토 모드]</b> 음원 <b>Percussive: B&O 봉고</b> · 목표 BRAS CR3 MP3 ·
      자리 중앙(설계 위치), P04, P08, P05<br/>CTR = 중앙 자리, B = 보정 없음, C = 보정(중앙 설계 초기·후기 에너지
      매칭), anchor35/anchor70 = 3.5/7 kHz 저역통과 앵커(BS.1534-3), reference = 숨긴 기준음.'
    showConditionNames: true
    randomize: false
  - type: mushra
    id: music
    name: 평가
    showWaveform: true
    enableLooping: true
    createAnchor35: false
    createAnchor70: false
    reference: configs/resources/audio/v18b/music_A.flac
    stimuli:
      CTR_B: configs/resources/audio/v18b/music_C_B.flac
      CTR_C: configs/resources/audio/v18b/music_C_M.flac
      P04_B: configs/resources/audio/v18b/music_P04_B.flac
      P04_C: configs/resources/audio/v18b/music_P04_M.flac
      P08_B: configs/resources/audio/v18b/music_P08_B.flac
      P08_C: configs/resources/audio/v18b/music_P08_M.flac
      P05_B: configs/resources/audio/v18b/music_P05_B.flac
      P05_C: configs/resources/audio/v18b/music_P05_M.flac
      anchor35: configs/resources/audio/v18b/music_A35.flac
      anchor70: configs/resources/audio/v18b/music_A70.flac
    content: '<b>[연구자 검토 모드]</b> 음원 <b>Music: 베토벤 8번</b> · 목표 BRAS CR3 MP3 · 자리 중앙(설계
      위치), P04, P08, P05<br/>CTR = 중앙 자리, B = 보정 없음, C = 보정(중앙 설계 초기·후기 에너지 매칭), anchor35/anchor70
      = 3.5/7 kHz 저역통과 앵커(BS.1534-3), reference = 숨긴 기준음.'
    showConditionNames: true
    randomize: false
- type: finish
  name: 끝
  content: 평가가 끝났습니다. 감사합니다.
  showResults: false
  writeResults: true
  questionnaire:
  - type: text
    label: '1. 참가자 코드<span class="t18hint">연구자가 알려 준 코드(예: L01)</span>'
    name: code
  - type: likert
    label: 2. 평가가 얼마나 어려웠나요?
    name: difficulty
    response:
    - value: '1'
      label: 1 쉬움
    - value: '2'
      label: '2'
    - value: '3'
      label: 3 보통
    - value: '4'
      label: '4'
    - value: '5'
      label: 5 매우 어려움
  - type: likert
    label: 3. 소리 사이의 작은 차이를 점수로 옮길 수 있었나요?
    name: mapping
    response:
    - value: 'yes'
      label: 예
    - value: partly
      label: 어느 정도
    - value: 'no'
      label: 아니오
  - type: likert
    label: 4. 화면마다 11개 소리가 모두 보였나요?
    name: ui_visible
    response:
    - value: 'yes'
      label: 예
    - value: 'no'
      label: 아니오
  - type: likert
    label: 5. 중간에 집중이 떨어졌나요?<span class="t18hint">연습 화면은 세지 않습니다</span>
    name: fatigue
    response:
    - value: 'no'
      label: 아니오
    - value: screen1
      label: 1번째 화면부터
    - value: screen2
      label: 2번째 화면부터
    - value: screen3
      label: 3번째 화면부터
  - type: likert
    label: 6. 지직거림이나 끊김이 들렸나요?<span class="t18hint">예라면 어느 화면의 어떤 소리였는지 7번에 적어 주세요</span>
    name: crackle
    response:
    - value: 'yes'
      label: 예
    - value: 'no'
      label: 아니오
  - type: long_text
    label: 7. 그 밖의 의견<span class="t18hint">선택 사항. 3번에서 어려웠던 이유 등</span>
    name: comment
    optional: true
