testname: 공간 음향 재현 청취평가
testId: t18_listener
bufferSize: 8192
stopOnErrors: true
showButtonPreviousPage: false
remoteService: service/write.php
pages:
- type: generic
  id: consent
  name: 연구 참여 동의
  content: <div style="display:inline-block;text-align:left;line-height:1.55"><div
    style="white-space:nowrap;margin:2px 0"><b>연구 참여 안내</b></div><div style="height:8px"></div><div
    style="white-space:nowrap;margin:2px 0"><b>목적</b>  어떤 공간의 울림을 다른 공간에서 재생할 때, 소리가
    원래 공간과 얼마나 비슷하게 들리는지 확인합니다.</div><div style="white-space:nowrap;margin:2px 0"><b>할
    일</b>  헤드폰으로 기준음과 여러 소리를 듣고, 기준음과 얼마나 비슷한지 0–100점으로 매긴 뒤 짧은 설문에 답합니다.</div><div
    style="white-space:nowrap;margin:2px 0"><b>시간</b>  연습 1화면과 본 평가 3화면입니다. 예상 시간은
    연구자가 안내합니다.</div><div style="white-space:nowrap;margin:2px 0"><b>위험</b>  재생 음량은
    연구자가 일상 수준으로 정해 두었습니다. 불편하면 언제든 멈출 수 있습니다.</div><div style="white-space:nowrap;margin:2px
    0"><b>자발성</b>  참여는 자유이며, 중간에 그만두어도 불이익이 없습니다.</div><div style="white-space:nowrap;margin:2px
    0"><b>수집 정보</b>  점수, 화면별 재생·조작 기록, 설문 답, 참가자 코드. 이름과 연락처는 결과에 저장하지 않습니다.</div><div
    style="white-space:nowrap;margin:2px 0"><b>이용</b>  학위·학회 논문과 발표에 쓰며, 개인을 알아볼 수
    없는 형태로만 공개합니다.</div><div style="white-space:nowrap;margin:2px 0">&nbsp;&nbsp;&nbsp;&nbsp;익명
    결과는 연구 재현을 위해 공개될 수 있습니다.</div><div style="white-space:nowrap;margin:2px 0"><b>문의</b>  궁금한
    점은 평가 전후에 연구자에게 물어보세요.</div><div style="height:8px"></div><div style="white-space:nowrap;margin:2px
    0"><label style="font-weight:600;cursor:pointer"><input type="checkbox" id="t18consent"
    data-role="none" style="width:18px;height:18px;vertical-align:middle;margin-right:8px">위
    내용을 읽었고, 연구 참여에 동의합니다.</label></div></div>
- type: generic
  id: welcome
  name: 안내
  content: <div style="display:inline-block;text-align:left;line-height:1.55"><div
    style="white-space:nowrap;margin:2px 0"><b>헤드폰으로 듣고, 각 소리가 기준음과 얼마나 비슷한지 점수를 매겨
    주세요.</b></div><div style="white-space:nowrap;margin:2px 0">연습 1화면과 본 평가 3화면이 있습니다.</div><div
    style="white-space:nowrap;margin:2px 0">화면마다 평가할 소리는 11개입니다.</div><div style="white-space:nowrap;margin:2px
    0">그중에는 기준음과 같은 소리, 일부러 소리를 나쁘게 만든 비교용 소리도 들어 있습니다.</div><div style="height:8px"></div><div
    style="white-space:nowrap;margin:2px 0">재생 음량은 연구자가 맞춰 두었습니다. 컴퓨터 음량은 바꾸지 마세요.</div><div
    style="white-space:nowrap;margin:2px 0"><b>브라우저 창을 최대화해 주세요.</b></div><div style="white-space:nowrap;margin:2px
    0">화면마다 Cond. 번호가 붙은 소리가 오른쪽 끝까지 모두 보이는지 확인해 주세요.</div><div style="white-space:nowrap;margin:2px
    0">보이지 않으면 연구자에게 알려 주세요.</div></div>
- type: generic
  id: train_intro
  name: 연습 안내
  content: <div style="display:inline-block;text-align:left;line-height:1.55"><div
    style="white-space:nowrap;margin:2px 0">다음 화면은 <b>연습</b>입니다. 결과는 분석에 쓰지 않습니다.</div><div
    style="height:8px"></div><div style="white-space:nowrap;margin:2px 0">소리 가운데 하나는
    기준음과 같은 소리입니다.</div><div style="white-space:nowrap;margin:2px 0">두 개는 고음을 잘라 일부러
    나쁘게 만든 소리입니다.</div><div style="white-space:nowrap;margin:2px 0">나머지 소리들은 음색이나
    울림의 양·길이가 기준음과 조금씩 다를 수 있습니다.</div><div style="height:8px"></div><div style="white-space:nowrap;margin:2px
    0">다음 세 가지를 연습해 보세요.</div><div style="white-space:nowrap;margin:2px 0">① 파형에서
    2–3초 구간을 지정해 반복 재생하기</div><div style="white-space:nowrap;margin:2px 0">② 가장 비슷한
    소리와 가장 다른 소리를 먼저 찾고, 나머지를 그 사이에 배치하기</div><div style="white-space:nowrap;margin:2px
    0">③ 넘어가기 전에 점수 높은 순서대로 들으며 점점 달라지는지 확인하기</div></div>
- type: mushra
  id: train
  name: 평가
  showWaveform: true
  enableLooping: true
  createAnchor35: false
  createAnchor70: false
  reference: configs/resources/audio/v18b/train_A.flac
  stimuli:
    P07_B: configs/resources/audio/v18b/train_P07_B.flac
    P07_C: configs/resources/audio/v18b/train_P07_M.flac
    P10_B: configs/resources/audio/v18b/train_P10_B.flac
    P10_C: configs/resources/audio/v18b/train_P10_M.flac
    P02_B: configs/resources/audio/v18b/train_P02_B.flac
    P02_C: configs/resources/audio/v18b/train_P02_M.flac
    P06_B: configs/resources/audio/v18b/train_P06_B.flac
    P06_C: configs/resources/audio/v18b/train_P06_M.flac
    anchor35: configs/resources/audio/v18b/train_A35.flac
    anchor70: configs/resources/audio/v18b/train_A70.flac
  content: '<div style="display:inline-block;text-align:left;line-height:1.55"><div
    style="white-space:nowrap;margin:2px 0"><b>기준음(Reference)과 비교해, 각 소리가 얼마나 비슷하게
    들리는지 점수를 주세요.</b></div><div style="white-space:nowrap;margin:2px 0">음색과 울림(잔향)을
    모두 포함한 전체 인상으로 판단해 주세요.</div><div style="white-space:nowrap;margin:2px 0">100
    = 기준음과 구별할 수 없음, 0 = 전혀 비슷하지 않음</div><div style="white-space:nowrap;margin:2px
    0">점수는 상대적으로 주면 됩니다. 소리들 사이의 순서와 간격이 중요합니다.</div><div style="height:8px"></div><div
    style="white-space:nowrap;margin:2px 0"><b>요령</b></div><div style="white-space:nowrap;margin:2px
    0">① 모든 소리를 한 번씩 듣고, 기준음과 가장 비슷한 소리와 가장 다른 소리를 먼저 찾으세요.</div><div style="white-space:nowrap;margin:2px
    0">② 나머지 소리를 그 사이에 배치하세요.</div><div style="white-space:nowrap;margin:2px 0">③
    차이가 작으면 파형에서 2–3초 구간을 지정해, 기준음과 번갈아 반복해 들어 보세요.</div><div style="white-space:nowrap;margin:2px
    0">④ 구별되지 않는 소리에는 같은 점수를 줘도 됩니다.</div><div style="white-space:nowrap;margin:2px
    0">⑤ 다음 화면으로 넘어가기 전에, 점수가 높은 소리부터 낮은 소리까지 차례로 한 번 들어 보세요.</div><div style="white-space:nowrap;margin:2px
    0">&nbsp;&nbsp;&nbsp;&nbsp;기준음과 점점 더 다르게 들리는지 확인하고, 순서가 맞지 않으면 점수를 고쳐 주세요.</div><div
    style="height:8px"></div><div style="white-space:nowrap;margin:2px 0"><b>모든 소리를
    듣고, 모든 슬라이더를 직접 움직여 주세요.</b></div><div style="white-space:nowrap;margin:2px 0">단축키:
    기준음 <b>₩</b> · 소리 1–9 <b>숫자키</b> · 10번 <b>0</b> · 11번 <b>-</b> · 재생/정지 <b>Space</b>
    · 정지 <b>Backspace</b></div></div>'
  randomize: true
